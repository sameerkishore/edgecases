name: EdgeCases
options:
  bundleIdPrefix: app.edgecases
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  EdgeCore:
    path: Packages/EdgeCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  EdgeCases:
    type: application
    platform: macOS
    sources:
      - path: EdgeCases
    dependencies:
      - package: EdgeCore
      - package: Sparkle
    info:
      path: EdgeCases/Info.plist
      properties:
        CFBundleDisplayName: EdgeCases
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Sameer Kishore."
        # Updates come from the latest GitHub release; scripts/publish_release.sh uploads the appcast.
        SUFeedURL: https://github.com/sameerkishore/edgecases/releases/latest/download/appcast.xml
        SUPublicEDKey: uRqL/pC3TLBg/Xaykwtrn/Rd9eN35rCWGBQZUGRaSos=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.edgecases.EdgeCases
        PRODUCT_NAME: EdgeCases
        # Icons and accent are drawn by scripts/make-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: EdgeCases/Touch/EdgeCases-Bridging-Header.h
        # Self-signed cert in the login Keychain: a stable signature keeps the Accessibility grant
        # across rebuilds (ad-hoc signatures change every build).
        CODE_SIGN_IDENTITY: "EdgeCases Signing"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
